[package]
name = "lexproof-registry"
version = "0.1.0"
edition = "2021"

[lib]
name = "lexproof_registry"
crate-type = ["cdylib"]
path = "src/lib.rs"
bench = false
doctest = false
test = false

[dependencies]
casper-contract = "=5.1.1"
casper-types = "=6.1.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
debug = false
opt-level = 3