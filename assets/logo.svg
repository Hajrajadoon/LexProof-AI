<svg xmlns="http://www.w3.org/2000/svg" width="560" height="140" viewBox="0 0 560 140" role="img" aria-label="LexProof AI logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1E3D"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- Emblem -->
  <rect x="20" y="20" width="100" height="100" rx="24" fill="url(#bg)"/>
  <path d="M52 40 V94 H84" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 66 L88 80 L110 50" fill="none" stroke="url(#check)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="144" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#0F1E3D">LexProof <tspan fill="#1E3A8A">AI</tspan></text>
  <text x="147" y="102" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="5" fill="#64748B">LEGAL INTELLIGENCE</text>
</svg>
